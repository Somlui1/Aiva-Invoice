<!doctype html><meta charset=utf-8><title>AIVA System A — test portal</title>
<style>
body{margin:0;font-family:Tahoma,sans-serif;font-size:13px;background:#fff}
#top{position:sticky;top:0;z-index:5;background:#eee;border-bottom:1px solid #bbb;padding:6px 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#stat{color:#333} #src{font-size:12px;color:#555} #src b{color:#111}
#strip{font-size:12px;color:#06a} #strip .t{margin-right:10px} #strip .f{color:#c00}
button{font-size:12px;padding:2px 8px} .run{font-weight:bold;padding:2px 12px}
#wrap{display:flex;align-items:stretch}
#side{width:270px;flex:none;height:calc(100vh - 44px);overflow:auto;border-right:1px solid #ccc;position:sticky;top:44px}
#side .row{padding:4px 8px;cursor:pointer;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .row:hover{background:#f3f3f3} #side .row.cur{background:#dbe9ff}
#side .d{color:#333} .step{color:#06a;font-size:11px}
#main{flex:1 1 auto;padding:10px;min-width:0;height:calc(100vh - 44px);overflow:auto;position:sticky;top:44px}
#panel{flex:none;width:min(46vw,660px);min-width:360px;height:calc(100vh - 44px);overflow:auto;position:sticky;top:44px;border-left:1px solid #ccc;background:#fbfbfb;padding:0 10px 14px}
#panel:empty{display:none}
#panel .phd{position:sticky;top:0;background:#fbfbfb;border-bottom:1px solid #ddd;padding:7px 0 5px;margin-bottom:5px;font-weight:bold}
@media (max-width:1180px){#wrap{flex-wrap:wrap}#main{height:auto;overflow:visible;position:static}
 #panel{width:100%;min-width:0;height:auto;overflow:visible;position:static;border-left:0;border-top:1px solid #ccc}}
.card{border:1px solid #999;margin:0 0 16px}
.ch{padding:5px 8px;background:#f4f4f4;border-bottom:1px solid #ccc;font-size:14px}
.meta{padding:4px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:#444;border-bottom:1px solid #eee}
.chip{font-size:12px;border:1px solid #bbb;background:#fff;padding:0 6px;border-radius:9px}
.pglink{font-size:12px;border:1px solid #bbb;background:#fff;padding:0 5px;border-radius:9px;cursor:pointer}
.acts{padding:5px 8px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;background:#fafafa;display:flex;gap:8px;align-items:center}
.st{color:#666;font-size:12px}
.pgs{padding:6px 8px}
.pg{display:block;padding:4px 0 12px;border-top:1px dashed #ddd}
.pgh{font-size:12px;color:#333;margin:0 0 4px}
.imgbox{position:relative;width:100%;max-width:1000px;flex:none}
.imgbox img{width:100%;display:block;border:1px solid #ccc}
.bx{position:absolute;box-sizing:border-box;border:1px solid transparent;cursor:pointer}
.bx span{position:absolute;left:-1px;top:-13px;font-size:9px;color:#fff;padding:0 2px;white-space:nowrap;overflow:hidden;max-width:100%}
.bx.hl{border-width:3px;background:rgba(255,220,0,.30);z-index:3}
.panel{padding:6px 9px;border-top:1px solid #ddd}
table{border-collapse:collapse;width:100%;font-size:12px;margin:3px 0} td,th{border:1px solid #ddd;padding:2px 5px;vertical-align:top;text-align:left}
th{background:#fafafa}
.rt td:nth-child(1){white-space:nowrap}
/* ตารางเทียบ invoice ↔ Oracle: สองข้างวางขนานกัน ตัวเลขเรียงลำดับเดียวกันเพื่อชี้ตาเทียบได้ */
.cmp{table-layout:fixed}
.cmp th:nth-child(1),.cmp td:nth-child(1){width:39%} .cmp th:nth-child(2),.cmp td:nth-child(2){width:22%}
.cmp th:nth-child(3),.cmp td:nth-child(3){width:39%}
.cmp td{background:#fff} .cmp tr.orconly td:nth-child(1){background:#f2f8ff} .cmp tr.invonly td:nth-child(3){background:#fff6ef}
.cmp .it{font-weight:bold;margin:1px 0}
.cmp .v{display:grid;grid-template-columns:auto 1fr;gap:0 8px;font-variant-numeric:tabular-nums}
.cmp .v span:nth-child(odd){color:#888}
.cmp.need tr.cmp-r:not(.cmp-need){display:none}
[data-cmp]{cursor:pointer}
.ok{color:#2a2} .partial{color:#d80} .error{color:#c00} .idle{color:#999}
.sec{margin:8px 0 3px} .err{color:#c00;font-size:12px;margin:4px 0} .ph{color:#888;font-size:12px;padding:16px 6px}
.ocrsec{margin-top:10px} .ocrh{font-size:12px;color:#333;margin:6px 0 2px;font-weight:bold}
.sw{display:inline-block;width:10px;height:10px;margin-right:4px}
tr[data-ref]{cursor:pointer} tr[data-ref]:hover,td[data-ref]:hover{background:#fff8d5}
tr.hl,td.hl{background:#fff8d5}
details pre{font-size:11px;margin:3px 0;max-height:280px;overflow:auto;border:1px solid #ddd;padding:4px;white-space:pre-wrap}
#types{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tg{font-size:12px;border:1px solid #bbb;background:#fff;padding:0 5px;border-radius:9px;cursor:pointer;user-select:none}
.tg.on{background:#333;color:#fff}
.tg input{display:none}
#tip{position:fixed;z-index:50;display:none;max-width:460px;background:#111;color:#fff;font-size:12px;line-height:1.4;padding:6px 8px;border-radius:4px;pointer-events:none}
#tip .big{font-size:14px;margin:2px 0}
#pin{position:fixed;left:12px;bottom:12px;z-index:40;display:none;max-width:430px;background:#fff;border:2px solid #333;font-size:12px;line-height:1.4;padding:7px 26px 7px 9px;border-radius:5px;box-shadow:0 2px 10px #0006}
#pin .ttl{font-size:12px;color:#444;border-bottom:1px solid #ddd;padding-bottom:3px;margin-bottom:4px}
#pin .big{font-size:15px;margin:3px 0}
.case{font-size:11px;color:#0a6}
/* ---- รอบการทดสอบ (results/<round>/) และการรันเป็นชุด ---- */
#round_sel{font-size:12px;max-width:190px}
#concurrency{width:38px;font-size:12px}
#batch_bar{display:none;background:#e8f0fe;border-bottom:1px solid #b9c7e6;padding:3px 10px;font-size:12px;position:relative}
#batch_bar.on{display:block}
#batch_fill{height:5px;background:#1a73e8;width:0;transition:width .35s}
#batch_txt{display:block;margin-top:2px}
.b{font-size:10px;padding:0 3px;border-radius:3px;margin-right:3px}
.b.bdone{background:#e2f0e3;color:#1b5e20} .b.berr{background:#fdecea;color:#b71c1c}
.b.bproc{background:#e8f0fe;color:#0d47a1} .b.bskip{background:#eee;color:#777}
.ck{display:inline-block;width:10px;height:10px;border:1px solid #888;margin-right:5px;background:#fff;
vertical-align:middle;cursor:pointer}
.ck.on{background:#1a73e8;border-color:#1a73e8}
/* ---- modal: summary ของรอบ และตารางเทียบสองรอบ ---- */
.modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:#0008;align-items:flex-start;
justify-content:center;padding:3vh 12px;overflow:auto}
.modal.on{display:flex}
.mbox{background:#fff;border:2px solid #333;width:100%;max-width:min(96vw,880px);max-height:94vh;display:flex;
flex-direction:column;box-shadow:0 6px 26px #0007}
.mbox.wide{max-width:min(98vw,1240px)}
.mhd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:#f2f2f2;
border-bottom:1px solid #bbb}
.mhd b{font-size:14px} .mbody{overflow:auto;padding:8px 10px 16px} .mx{margin-left:auto}
.vbar{display:grid;grid-template-columns:132px 1fr 44px;gap:6px;align-items:center;margin:2px  0;font-size:12px}
.vbar .vb{display:block;height:14px;background:#f2f2f2;border:1px solid #ddd}
.vbar .vb-in{display:block;height:100%;min-width:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;border:1px solid #0002}
.v-AUTO_PASS{background:#2e7d32} .v-REVIEW{background:#ef6c00} .v-MANUAL_REVIEW{background:#c62828}
.v-HOLD{background:#6a1b9a} .v-SYSTEM_ERROR,.v-FAILED{background:#37474f} .v-NONE{background:#bbb}
.crd{display:inline-block;border:1px solid #bbb;margin:0 6px 6px 0;padding:4px 10px;text-align:center;min-width:74px}
.crd b{display:block;font-size:16px} .up{color:#1b5e20} .down{color:#b71c1c} .flat{color:#777}
table.diff{table-layout:fixed} .diff td:nth-child(1){width:64px} .diff td:nth-child(2),.diff td:nth-child(3){width:26%}
td.d-up{background:#e7f6e7} td.d-down{background:#fdecea} td.d-added{background:#eef3fb} td.d-removed{background:#f6f1ea}
td.d-flat{color:#777} tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:#fff8d5}
</style>
<div id=top>
 <b>AIVA System A</b>
 <label>รอบ <select id=round_sel title="ผลของแต่ละรอบอยู่คนละโฟลเดอร์ใน engine/results — เลือกเพื่ออ่าน/เขียนรอบนั้น"></select>
 <button id=btn_new_round title="สร้างโฟลเดอร์รอบใหม่ แล้วเปิดรอบนั้นทันที">+ รอบใหม่</button></label>
 <span id=stat></span>
 <button id=run class=run>Process</button>
 <input id=concurrency type=number min=1 max=64 value=10 title="จำนวนเอกสารที่รันพร้อมกันในชุดนี้" size=3>
 <label title="ข้ามเอกสารที่รอบนี้มีผลอยู่แล้ว ไม่ได้ลบของเดิม"><input type=checkbox id=skip_existing checked> ข้ามที่มีผลแล้ว</label>
 <button id=btn_batch class=run title="ประมวลเอกสารที่ติ๊กไว้ (ไม่ติ๊ก = ทั้งหมดที่เห็นในรายการ)">Run Batch</button>
 <button id=btn_stop title="หยุดรับงานที่ยังไม่เริ่ม — งานที่กำลังรันอยู่ปล่อยให้เสร็จ">หยุด</button>
 <button id=btn_summary title="summary.json ของรอบนี้">Summary</button>
 <button id=btn_compare title="เทียบผลสองรอบว่าอะไรดีขึ้น/แย่ลง">Compare</button>
 <input id=q placeholder="ค้น id / ชื่อ / ข้อความในผล" size=18>
 <label>ชนิดกรอบ <select id=ft><option value="">ทั้งหมด</option></select></label>
 <label><input type=checkbox id=ov checked> <b>แสดง bbox</b></label>
 <span id=types></span>
 <button id=rf title="อ่านรายการเอกสารจาก Paperless ใหม่">รีเฟรชรายการ</button>
 <button id=clr title="ลบ case ทั้งหมดที่เก็บไว้ใน browser นี้">ล้าง case</button>
 <span id=strip></span>
 <span id=src></span>
</div>
<div id=batch_bar><div id=batch_fill></div><span id=batch_txt></span></div>
<div id=wrap><div id=side></div><div id=main></div><div id=panel></div></div>
<div id=tip></div><div id=pin></div>
<div id=modal_summary class=modal><div class=mbox>
 <div class=mhd><b id=sm_title>Summary ของรอบ</b><span id=sm_note class=st></span>
  <button id=sm_rebuild title="รวม summary.json จากไฟล์ผลใหม่ ทั้งรอบ">รวมใหม่</button>
  <button id=sm_dl title="เปิดไฟล์ summary.json ที่รอบนี้เก็บไว้">ไฟล์</button>
  <button class=mx>ปิด</button></div>
 <div class=mbody id=sm_body></div>
</div></div>
<div id=modal_compare class=modal><div class="mbox wide">
 <div class=mhd><b>เทียบสองรอบ</b>
  <label>Base <select id=cmp_base></select></label> <label>Target <select id=cmp_target></select></label>
  <button id=cmp_run>เทียบ</button> <span id=cmp_note class=st></span> <button class=mx>ปิด</button></div>
 <div class=mbody id=cmp_body></div>
</div></div>
<script src="/static/app.js"></script>
