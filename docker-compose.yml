# =============================================================================
# AIVA — Unified Backend Compose (Engine + Portal)
#
# Usage:
#   docker compose up -d --build          # build + start both services
#   docker compose logs -f engine         # engine daemon logs (per-doc ▶ stage / ✓ DONE / ✗ FAILED)
#   curl -s localhost:8080/status | jq    # what the engine is doing right now
#   docker compose logs -f portal         # portal logs: dated lines, ingest ✓/↺/✗, http errors, "alive" heartbeat
#   docker compose ps                     # STATUS must read "(healthy)" for portal + engine
#   docker compose down                   # stop (volumes stay)
#   docker compose down -v                # stop + wipe volumes (fresh DB)
#
# Ports:
#   Engine API  : http://<host>:8080  (ENGINE_PORT)
#   Portal UI   : http://<host>:3001  (PORTAL_PORT)
#
# Database separation:
#   Portal in Docker → named volume aiva_portal_data:/app/data/aiva.db
#   Portal via `npm start` (host) → ./prisma/dev.db   (untouched by compose)
#
# v5.16 — no silent hangs:
#   - restart: always on both services + in-process watchdogs that EXIT on a stuck pipeline
#   - healthchecks that fail when the ingest pipeline (portal) or the worker loop (engine) is stuck
#   - autoheal restarts any container labelled autoheal=true that Docker marks "unhealthy"
#     (Docker itself never restarts an unhealthy container — only an exited one)
#   - TZ=Asia/Bangkok so every log line shows Thai local time
#
# Network:
#   Both services on default network.
#   External reverse proxy access via proxy-net (external: true).
#   Engine resolves portal via container DNS: http://aiva-portal:3000
#   host.docker.internal allows engine to reach npm start on host (fallback).
# =============================================================================
name: aiva

services:

  # ---------------------------------------------------------------------------
  # portal — AIVA Frontend (Next.js / Express)
  # ---------------------------------------------------------------------------
  portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aiva-portal:latest
    container_name: aiva-portal
    # v5.16: always (was unless-stopped) + init → the watchdog's exit(1) always comes back
    restart: always
    init: true
    stop_grace_period: 20s
    labels:
      autoheal: "true"
    env_file: ./frontend/.env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Bangkok}
      # v5.16 — terminal log (src/server/log.ts) + watchdog (src/server/watchdog.ts)
      LOG_LEVEL: ${PORTAL_LOG_LEVEL:-info}            # debug = every /api request
      LOG_TZ: ${TZ:-Asia/Bangkok}
      LOG_HEARTBEAT_MIN: ${PORTAL_HEARTBEAT_MIN:-15}
      LOG_SLOW_MS: ${PORTAL_LOG_SLOW_MS:-1500}
      WATCHDOG_ENABLED: ${PORTAL_WATCHDOG:-true}
      WATCHDOG_INGEST_STUCK_SEC: ${PORTAL_INGEST_STUCK_SEC:-300}
      INGEST_STUCK_SEC: ${PORTAL_HEALTH_INGEST_STUCK_SEC:-120}
      BODY_LIMIT: ${PORTAL_BODY_LIMIT:-50mb}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Docker-specific DB path — separate from npm start (./prisma/dev.db)
      DATABASE_URL: file:/app/data/aiva.db
      LDAP_CA_FILE: /run/secrets/ldap_ca.pem
      PDF_CACHE_DIR: /app/cache
      AUTH_DEV_LOGIN: "false"
      VITE_AUTH_MOCK: "false"
      VITE_AUTH_BYPASS: "false"
      AIVA_SEED_SAMPLE: "false"
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    ports:
      - "3000:3000"
    secrets:
      - ldap_ca.pem
    volumes:
      - aiva_portal_data:/app/data
      - aiva_portal_cache:/app/cache
    networks:
      - default
      - proxy-net
    healthcheck:
      # v5.16: /api/health = DB ping (3 s cap) + ingest-pipeline-not-stuck
      test: [ "CMD-SHELL", "wget -q -T 8 -O- http://127.0.0.1:3000/api/health >/dev/null || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # engine — AIVA System A Flow Engine & Daemon Worker
  # ---------------------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiva-engine:latest
    container_name: aiva-engine
    # v5.15: "always" also restarts after the watchdog exits the process (exit 1)
    restart: always
    init: true
    stop_grace_period: 15s
    labels:
      autoheal: "true"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Bangkok}
      AUTO_PROCESS: ${AUTO_PROCESS:-true}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      BATCH_SIZE: ${BATCH_SIZE:-5}
      STALE_LOCK_TIMEOUT_SECONDS: ${STALE_LOCK_TIMEOUT_SECONDS:-1800}
      # Primary target: portal container via Docker DNS
      FRONTEND_BASE_URL: http://aiva-portal:3000
      FRONTEND_INGEST_PATH: ${FRONTEND_INGEST_PATH:-/api/engine/ingest}
      ENGINE_INGEST_KEY: ${ENGINE_INGEST_KEY}
      # v5.16 — delivery guarantees (engine/src/system_a/flow_worker.py · FrontendClient)
      #   no hidden fallback hosts: the Engine delivers ONLY to aiva-portal (list extra hosts here if needed)
      FRONTEND_FALLBACK_HOSTS: ${FRONTEND_FALLBACK_HOSTS:-}
      #   Paperless doc → PROCESSED only after GET /api/engine/ingest/<validation_id> confirms the row
      FRONTEND_VERIFY_INGEST: ${FRONTEND_VERIFY_INGEST:-true}
      FRONTEND_PUSH_TIMEOUT_SECONDS: ${FRONTEND_PUSH_TIMEOUT_SECONDS:-40}
      FRONTEND_PUSH_ATTEMPTS: ${FRONTEND_PUSH_ATTEMPTS:-3}
      # v5.17 — "tagged AIVA processed but not in the queue"
      #   a 200 whose receipt cannot be checked is retried, not tagged PROCESSED (old Portals without
      #   the receipt endpoint are still accepted)
      FRONTEND_REQUIRE_RECEIPT: ${FRONTEND_REQUIRE_RECEIPT:-true}
      #   reconciler: PROCESSED docs the Portal answers found:false are sent back for processing
      #   off | report | fix · status: GET :8080/reconcile · run now: POST :8080/reconcile/run?mode=report
      RECONCILE_MODE: ${RECONCILE_MODE:-fix}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-600}
      RECONCILE_LOOKBACK_DAYS: ${RECONCILE_LOOKBACK_DAYS:-14}
      RECONCILE_MAX_REQUEUE: ${RECONCILE_MAX_REQUEUE:-10}          # circuit breaker (per run)
      RECONCILE_MAX_MISSING_RATIO: ${RECONCILE_MAX_MISSING_RATIO:-0.2}
      #   optional pin: the Portal instance id from GET :3000/api/health (hostname/db-hash)
      FRONTEND_EXPECT_INSTANCE: ${FRONTEND_EXPECT_INSTANCE:-}
      # v5.15 — readable logs for `docker compose logs -f engine`
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}            # text | json
      IDLE_LOG_INTERVAL_SECONDS: ${IDLE_LOG_INTERVAL_SECONDS:-60}
      # v5.15 — anti-hang: per-stage timeout + watchdog (process exits → restart policy restarts it)
      DOC_STAGE_TIMEOUT_SECONDS: ${DOC_STAGE_TIMEOUT_SECONDS:-180}
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-true}
      WATCHDOG_STALL_SECONDS: ${WATCHDOG_STALL_SECONDS:-300}
      WATCHDOG_CHECK_SECONDS: ${WATCHDOG_CHECK_SECONDS:-30}
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    volumes:
      - engine_cache:/engine/cache
      - ./engine/config:/engine/config:ro
      - ./engine/src:/engine/src:ro
    depends_on:
      portal:
        condition: service_healthy
    extra_hosts:
      # Allows engine to reach host npm start (port 3000) as fallback
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy-net
    healthcheck:
      # v5.15: /health/live now returns 503 when the worker loop is hung (status shows "unhealthy")
      test: [ "CMD-SHELL", "curl -fsS -m 4 http://127.0.0.1:8080/health/live >/dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # autoheal — restarts containers labelled autoheal=true when their healthcheck says "unhealthy".
  # v5.16: Docker's restart policy only reacts to an EXITED process; a hung-but-running process stays
  # hung forever without this. Needs the Docker socket (read the security note in the changelog).
  # ---------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: aiva-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-15}
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD:-120}
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 20
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  ldap_ca.pem:
    file: ${LDAP_CA_FILE_HOST:-./frontend/secrets/ldap_ca.pem}

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  default:
  proxy-net:
    external: true

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  engine_cache:
  aiva_portal_data:
  aiva_portal_cache:
