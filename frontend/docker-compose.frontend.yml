# =============================================================================
# AIVA Portal - Standalone Frontend Web Application & API
# =============================================================================
# Run standalone:
#   docker compose -f docker-compose.frontend.yml up -d
# =============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: aiva-portal-frontend:latest
    container_name: aiva-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/aiva.db
      - NEXT_PUBLIC_AUTH_MOCK=false
      - NEXT_PUBLIC_AUTH_BYPASS=false
      - LDAP_URL=${LDAP_URL:-ldaps://dc.aapico.com:636}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:-DC=aapico,DC=com}
      - AUTH_SECRET=${AUTH_SECRET:-change-this-in-production-aiva-secret-key-12345}
      - CACHE_DIR=/app/cache
    volumes:
      - sqlite_data:/app/data
      - aiva_cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - aiva-frontend-net

volumes:
  sqlite_data:
    driver: local
  aiva_cache:
    driver: local

networks:
  aiva-frontend-net:
    driver: bridge
