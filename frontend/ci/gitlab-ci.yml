# =============================================================================
# AIVA Portal (frontend/) — CI/CD for versioned patches · docker compose (same as v5.12)
#
# ใช้งาน: ใน .gitlab-ci.yml ที่ root ของ repo ใส่
#     include:
#       - local: frontend/ci/gitlab-ci.yml
# (หรือคัดลอกไฟล์นี้ไปแทน — งาน check/build/deploy เดิมของ v5.12 ถูกรวมไว้ที่นี่แล้ว)
#
# Flow:   agent apply patch → commit "patch vX.Y.Z" → push
#   MR / branch : check (typecheck + affected tests --deep)            ~30–90 s
#   main        : check (full suite ครั้งเดียว) → build image → deploy (docker compose) → health → auto-rollback
#   manual      : rollback (image ก่อนหน้า) · clear-documents
#
# ตัวแปร (Settings › CI/CD › Variables)
#   AIVA_ENV  (type File)  เนื้อหา .env ของ server (เหมือน v5.12)
#   AIVA_DEPLOY_DIR        โฟลเดอร์ deploy บน server (ค่าเริ่มต้น: $CI_PROJECT_DIR/frontend)
# Runner: tag `aiva-server` (shell executor บนเครื่องที่รัน docker) · ไม่ใช้ registry
# =============================================================================

variables:
  AIVA_DIR: frontend
  npm_config_cache: $CI_PROJECT_DIR/.npm

stages:
  - check
  - build
  - deploy

.node:
  image: node:22.23.4-alpine
  before_script:
    - cd "$AIVA_DIR"
    - apk add --no-cache git libc6-compat openssl >/dev/null
    - npm ci --no-audit --no-fund
    - npx prisma generate
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm/]

# ---- check: never the full suite on every push ------------------------------------------------
check:mr:
  extends: .node
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch --depth=200 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - node scripts/patch/verify.mjs --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --deep

check:branch:
  extends: .node
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - git fetch --depth=200 origin "$CI_DEFAULT_BRANCH"
    - node scripts/patch/verify.mjs --base "origin/$CI_DEFAULT_BRANCH" --deep

check:main:
  extends: .node
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    # ครั้งเดียวก่อนขึ้น server: typecheck + full suite + vite build
    - node scripts/patch/verify.mjs --full --build
  artifacts:
    when: always
    expire_in: 14 days
    paths: [frontend/docs/change/applied.json]

# ---- build: image tagged with the patch version (package.json) + commit ----------------------
build:
  stage: build
  tags: [aiva-server]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd "$AIVA_DIR"
    - cp "$AIVA_ENV" .env
    - sh scripts/deploy/compose-deploy.sh build

deploy:
  stage: deploy
  tags: [aiva-server]
  resource_group: aiva-production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd "${AIVA_DEPLOY_DIR:-$CI_PROJECT_DIR/$AIVA_DIR}"
    - cp "$AIVA_ENV" .env
    - sh scripts/deploy/compose-deploy.sh up

rollback:
  stage: deploy
  tags: [aiva-server]
  resource_group: aiva-production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd "${AIVA_DEPLOY_DIR:-$CI_PROJECT_DIR/$AIVA_DIR}"
    - cp "$AIVA_ENV" .env
    - sh scripts/deploy/compose-deploy.sh rollback

clear-documents:
  stage: deploy
  tags: [aiva-server]
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker compose -p aiva-portal exec -T portal npm run db:clear-docs -- --yes
