# =============================================================================
# AIVA Portal — production stack
#
# Every secret comes from the environment (an .env file next to this file that is NOT committed,
# or the host's secret store). Variables marked :? stop `docker compose up` when missing.
# The server itself also refuses to start with an incomplete production config
# (src/server/auth/config.ts → productionConfigProblems).
# =============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile          # Vite SPA + Express API (Dockerfile.frontend is the obsolete Next.js image)
    image: aiva-portal-frontend:latest
    container_name: aiva-portal-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"         # only the reverse proxy (TLS) talks to the container
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TRUST_PROXY=1
      - DATABASE_URL=${DOCKER_DATABASE_URL:-file:/app/data/aiva.db}
      # --- session ---
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required (openssl rand -hex 32)}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-8}
      - AUTH_BOOTSTRAP_ADMINS=${AUTH_BOOTSTRAP_ADMINS:-}
      # --- Active Directory (ldaps only) ---
      - LDAP_URL=${LDAP_URL:?LDAP_URL is required (ldaps://…)}
      - LDAP_BIND_DN=${LDAP_BIND_DN:?LDAP_BIND_DN is required}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:?LDAP_BIND_PASSWORD is required}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:?LDAP_SEARCH_BASE is required}
      - LDAP_UPN_SUFFIX=${LDAP_UPN_SUFFIX:-aapico.com}
      - LDAP_CA_FILE=/run/secrets/ldap_ca.pem
      - ALLOW_ITSUPPORT_BIND=${ALLOW_ITSUPPORT_BIND:-false}
      # --- Microsoft 365 / Entra ID (optional: all four or none) ---
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-}
      # --- Paperless (read-only token) ---
      - PAPERLESS_URL=${PAPERLESS_URL:?PAPERLESS_URL is required}
      - PAPERLESS_TOKEN=${PAPERLESS_TOKEN:?PAPERLESS_TOKEN is required}
      - PAPERLESS_TIMEOUT_MS=${PAPERLESS_TIMEOUT_MS:-10000}
      # --- machine-to-machine keys ---
      - ENGINE_INGEST_KEY=${ENGINE_INGEST_KEY:?ENGINE_INGEST_KEY is required}
      - ORACLE_CALLBACK_KEY=${ORACLE_CALLBACK_KEY:?ORACLE_CALLBACK_KEY is required}
      - ORACLE_MCP_URL=${ORACLE_MCP_URL:-}
      - ORACLE_MCP_TOKEN=${ORACLE_MCP_TOKEN:-}
      - CACHE_DIR=/app/cache
    secrets:
      - ldap_ca.pem
    volumes:
      - sqlite_data:/app/data
      - aiva_cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - aiva-network

  # SQL Server for production — enable together with the SQL Server task
  # (prisma provider "sqlserver" + migrations), then set
  # DATABASE_URL=sqlserver://mssql:1433;database=aiva;user=aiva_app;password=…;encrypt=true;trustServerCertificate=false
  # mssql:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?required}
  #     - MSSQL_PID=Standard
  #   volumes:
  #     - mssql_data:/var/opt/mssql
  #   networks:
  #     - aiva-network

secrets:
  ldap_ca.pem:
    file: ${LDAP_CA_FILE_HOST:-./secrets/ldap_ca.pem}

volumes:
  sqlite_data:
    driver: local
  aiva_cache:
    driver: local
  # mssql_data:
  #   driver: local

networks:
  aiva-network:
    driver: bridge
